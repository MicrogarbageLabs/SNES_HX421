# ============================================================
#  h1_lorom.cfg — ld65 config for the H1 bring-up probe.
#
#  A REAL LoROM image for the FXPak to load off SD, not the HiROM-shaped
#  window the emulator path uses (snes/hx421.cfg). 128 KB so the header
#  scoring in sd2snes' smc.c sees an ordinary-looking cartridge.
#
#  LoROM maps bank $00:$8000-$FFFF to file offset $0000-$7FFF, so the
#  header sits at file $7FC0 and the vectors at $7FE4.
#
#  Public domain (CC0). No warranty.
# ============================================================

MEMORY {
    ZP:      start = $0000, size = $0100, type = rw;
    RAM:     start = $0200, size = $1E00, type = rw;

    # bank 0 of a LoROM image: $8000-$FFFF -> file $0000-$7FFF
    ROM0:    start = $8000, size = $7FC0, type = ro, fill = yes, fillval = $FF, file = %O;
    HEADER:  start = $FFC0, size = $0020, type = ro, fill = yes, fillval = $00, file = %O;
    VECTORS: start = $FFE0, size = $0020, type = ro, fill = yes, fillval = $00, file = %O;

    # pad to 128 KB so the image is a normal cartridge size
    PAD:     start = $0000, size = $18000, type = ro, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    CODE:    load = ROM0,    type = ro,  start = $8000;
    HDR:     load = HEADER,  type = ro;
    VECTORS: load = VECTORS, type = ro,  start = $FFE4;
}
